<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Inventory Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="navbar-content">
                <h1 class="navbar-brand">📦 Inventory Dashboard</h1>
                <div class="navbar-actions">
                    <button class="btn btn-refresh" onclick="refreshInventory()">🔄 Refresh</button>
                </div>
            </div>
        </nav>
        
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
        
        <footer class="footer">
            <p>&copy; 2024 Inventory Dashboard | Last updated: <span id="last-updated">--</span></p>
        </footer>
    </div>
    
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
